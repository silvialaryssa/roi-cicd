# Copie este arquivo para .streamlit/secrets.toml para rodar localmente.
# No Streamlit Community Cloud, cole este mesmo conteúdo em App > Settings > Secrets.

admin_email = "admin@cuidafacil.com"

# ID da planilha Google Sheets já criada no Google Drive.
spreadsheet_id = ""

# Google Analytics 4 - Measurement Protocol.
ga4_measurement_id = ""
ga4_api_secret = ""

[gcp_service_account]
type = "service_account"
project_id = "seu-projeto"
private_key_id = "sua-private-key-id"
private_key = "-----BEGIN PRIVATE KEY-----\nSUA_CHAVE_PRIVADA\n-----END PRIVATE KEY-----\n"
client_email = "sua-service-account@seu-projeto.iam.gserviceaccount.com"
client_id = "000000000000000000000"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/sua-service-account%40seu-projeto.iam.gserviceaccount.com"
universe_domain = "googleapis.com"
